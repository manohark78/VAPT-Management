spring:
  datasource:
    url: jdbc:h2:file:./data/vaptdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    show-sql: false
  flyway:
    clean-disabled: true
  h2:
    console:
      enabled: true
      path: /h2-console

logging:
  level:
    com.company.vapt: INFO
    org.springframework.security: INFO
    org.flywaydb: INFO
